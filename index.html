<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI ChatBot</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f172a;
    height:100vh;
    overflow:hidden;
    color:white;
}

.container{
    display:flex;
    height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:280px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border-right:1px solid rgba(255,255,255,0.1);
    padding:20px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.logo{
    font-size:28px;
    font-weight:700;
    background:linear-gradient(to right,#8b5cf6,#06b6d4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:30px;
}

.new-chat{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(to right,#8b5cf6,#06b6d4);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

.new-chat:hover{
    transform:scale(1.03);
}

.menu{
    margin-top:30px;
}

.menu-item{
    padding:14px;
    margin-bottom:10px;
    border-radius:12px;
    cursor:pointer;
    transition:0.3s;
    background:rgba(255,255,255,0.04);
}

.menu-item:hover{
    background:rgba(255,255,255,0.1);
}

.profile{
    padding:15px;
    border-radius:14px;
    background:rgba(255,255,255,0.05);
    display:flex;
    align-items:center;
    gap:12px;
}

.profile img{
    width:45px;
    height:45px;
    border-radius:50%;
}

/* CHAT AREA */

.chat-area{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    position:relative;
}

.topbar{
    padding:20px 30px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
}

.topbar h2{
    font-size:22px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:30px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.message{
    max-width:70%;
    padding:16px 20px;
    border-radius:18px;
    line-height:1.6;
    animation:fadeIn 0.3s ease;
}

.user{
    align-self:flex-end;
    background:linear-gradient(to right,#8b5cf6,#06b6d4);
}

.bot{
    align-self:flex-start;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.08);
}

.typing{
    display:flex;
    gap:5px;
}

.typing span{
    width:8px;
    height:8px;
    background:white;
    border-radius:50%;
    animation:bounce 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:0.2s;
}

.typing span:nth-child(3){
    animation-delay:0.4s;
}

/* INPUT AREA */

.input-area{
    padding:20px;
    border-top:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(20px);
}

.input-box{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.08);
    border-radius:18px;
    padding:10px;
}

.input-box input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
    padding:12px;
}

.input-box button{
    border:none;
    background:linear-gradient(to right,#8b5cf6,#06b6d4);
    color:white;
    padding:12px 20px;
    border-radius:14px;
    cursor:pointer;
    transition:0.3s;
}

.input-box button:hover{
    transform:scale(1.05);
}

/* ANIMATION */

@keyframes bounce{
    0%,80%,100%{
        transform:translateY(0);
        opacity:0.5;
    }
    40%{
        transform:translateY(-8px);
        opacity:1;
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* SCROLLBAR */

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-thumb{
    background:#8b5cf6;
    border-radius:10px;
}

/* MOBILE */

@media(max-width:768px){

    .sidebar{
        display:none;
    }

    .message{
        max-width:90%;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div>

            <div class="logo">AI Chat</div>

            <button class="new-chat">+ New Chat</button>

            <div class="menu">

                <div class="menu-item">Recent Chat 1</div>
                <div class="menu-item">Recent Chat 2</div>
                <div class="menu-item">AI Assistant</div>
                <div class="menu-item">Settings</div>

            </div>

        </div>

        <div class="profile">

            <img src="https://i.pravatar.cc/100" alt="">
            <div>
                <div>User</div>
                <small>Premium Plan</small>
            </div>

        </div>

    </div>

    <!-- CHAT AREA -->

    <div class="chat-area">

        <div class="topbar">
            <h2>AI Assistant</h2>
        </div>

        <div class="messages" id="messages">

            <div class="message bot">
                Hello 👋<br>
                How can I help you today?
            </div>

        </div>

        <div class="input-area">

            <div class="input-box">

                <input type="text" id="userInput" placeholder="Type your message...">

                <button onclick="sendMessage()">Send</button>

            </div>

        </div>

    </div>

</div>

<script>

function sendMessage(){

    let input=document.getElementById("userInput");
    let message=input.value.trim();

    if(message==="") return;

    let messages=document.getElementById("messages");

    // USER MESSAGE

    let userDiv=document.createElement("div");
    userDiv.classList.add("message","user");
    userDiv.innerText=message;

    messages.appendChild(userDiv);

    input.value="";

    messages.scrollTop=messages.scrollHeight;

    // TYPING

    let typing=document.createElement("div");
    typing.classList.add("message","bot");

    typing.innerHTML=`
        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    messages.appendChild(typing);

    messages.scrollTop=messages.scrollHeight;

    // BOT RESPONSE

    setTimeout(()=>{

        typing.remove();

        let botDiv=document.createElement("div");
        botDiv.classList.add("message","bot");

        botDiv.innerText="This is an AI response for: " + message;

        messages.appendChild(botDiv);

        messages.scrollTop=messages.scrollHeight;

    },1500);

}

</script>

</body>
</html>
